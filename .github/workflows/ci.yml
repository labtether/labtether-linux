name: CI

on:
  workflow_dispatch:
  # main requires an up-to-date branch, so the pull request run already
  # tested the merged code. Run on main only when dependencies change, to
  # refresh the caches pull requests read.
  push:
    branches: [main]
    paths:
      - go.sum
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.select.outputs.checks_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select source checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          base = os.environ.get("BASE_SHA", "")
          required = True
          if base and set(base) != {"0"}:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"],
                  check=True, capture_output=True,
              )
              paths = [os.fsdecode(p) for p in result.stdout.split(b"\0") if p]
              prose = {"README.md", "CHANGELOG.md", "AGENTS.md", "CLAUDE.md", "LICENSE"}
              required = any(
                  p not in prose and not (p.startswith(("docs/", "notes/")) and p.endswith(".md"))
                  for p in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checks_required={str(required).lower()}\n")
          PY
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py
      - name: Block personal details
        run: python3 scripts/ci/check-private-info.py

  fast-contracts:
    needs: [line-limit]
    if: ${{ !cancelled() }}
    name: Fast Linux agent contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require source-size gate
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Check formatting
        if: needs.line-limit.outputs.checks_required != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          go_files=()
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            while IFS= read -r -d '' go_file; do
              go_files+=("${go_file}")
            done < <(git ls-files -z '*.go')
          else
            while IFS= read -r -d '' go_file; do
              go_files+=("${go_file}")
            done < <(
              git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}" HEAD -- '*.go'
            )
          fi
          if (( ${#go_files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf '::error title=Go formatting required::Format these files: %s\n' "${unformatted//$'\n'/, }"
            exit 1
          fi
      - name: Vet
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          go vet ./...
      - name: Race and behavior tests
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          go test -race ./...
      - name: Build installed Linux command
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/labtether-agent" ./cmd/labtether-agent
      - name: Verify installed command starts
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          "${RUNNER_TEMP}/labtether-agent" --help >/dev/null
      - name: Install pinned source-quality tools
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
          CHECKS_REQUIRED: ${{ needs.line-limit.outputs.checks_required }}
        run: |
          if [[ "${CHECKS_REQUIRED}" != "false" ]]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          fi
          # actionlint and gitleaks are release binaries pinned by SHA-256.
          # Building both from source took about 40 seconds on every run.
          fetch_tool() {
            local binary="$1" sha="$2" url="$3"
            local archive="${RUNNER_TEMP}/${binary}.tar.gz"
            curl --fail --location --silent --show-error --retry 3 \
              "${url}" --output "${archive}"
            echo "${sha}  ${archive}" | sha256sum --check --quiet
            mkdir -p "${GOBIN}"
            tar -xzf "${archive}" -C "${GOBIN}" "${binary}"
          }
          fetch_tool actionlint \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          fetch_tool gitleaks \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Security and workflow contracts
        env:
          CHECKS_REQUIRED: ${{ needs.line-limit.outputs.checks_required }}
        run: |
          if [[ "${CHECKS_REQUIRED}" != "false" ]]; then
            gosec -quiet ./...
          fi
          actionlint
          gitleaks dir . --no-banner --redact --timeout 300

  cross-platform-source-contract:
    name: Source portability (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [line-limit]
    if: >-
      !cancelled() && (needs.line-limit.result != 'success' ||
      needs.line-limit.outputs.checks_required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Require source-size and selection gates
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
        run: test "${LINE_LIMIT_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Compile command and test packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p "${RUNNER_TEMP}/test-binaries"
          go build -trimpath -o "${RUNNER_TEMP}/labtether-agent-${GOOS}-${GOARCH}" ./cmd/labtether-agent
          go test -c -o "${RUNNER_TEMP}/test-binaries/" ./...

  ci-result:
    name: CI result
    if: always()
    needs: [line-limit, fast-contracts, cross-platform-source-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          jobs = json.loads(os.environ["NEEDS_JSON"])
          for name in ("line-limit", "fast-contracts"):
              if jobs[name]["result"] != "success":
                  raise SystemExit(f"Required check failed: {name}")
          required = jobs["line-limit"]["outputs"].get("checks_required")
          if required not in ("true", "false"):
              raise SystemExit("Missing check selection")
          accepted = {"success"} if required == "true" else {"success", "skipped"}
          if jobs["cross-platform-source-contract"]["result"] not in accepted:
              raise SystemExit("Source portability checks did not pass")
          PYCODE
