name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.select.outputs.checks_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select source checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          base = os.environ.get("BASE_SHA", "")
          required = True
          if base and set(base) != {"0"}:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"],
                  check=True, capture_output=True,
              )
              paths = [os.fsdecode(p) for p in result.stdout.split(b"\0") if p]
              prose = {"README.md", "CHANGELOG.md", "AGENTS.md", "CLAUDE.md", "LICENSE"}
              required = any(
                  p not in prose and not (p.startswith(("docs/", "notes/")) and p.endswith(".md"))
                  for p in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checks_required={str(required).lower()}\n")
          PY
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py

  fast-contracts:
    needs: [line-limit]
    if: ${{ !cancelled() }}
    name: Fast Linux agent contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require source-size gate
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Check formatting
        if: needs.line-limit.outputs.checks_required != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          go_files=()
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            while IFS= read -r -d '' go_file; do
              go_files+=("${go_file}")
            done < <(git ls-files -z '*.go')
          else
            while IFS= read -r -d '' go_file; do
              go_files+=("${go_file}")
            done < <(
              git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}" HEAD -- '*.go'
            )
          fi
          if (( ${#go_files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            printf '::error title=Go formatting required::Format these files: %s\n' "${unformatted//$'\n'/, }"
            exit 1
          fi
      - name: Vet
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          go vet ./...
      - name: Race and behavior tests
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          go test -race ./...
      - name: Build installed Linux command
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/labtether-agent" ./cmd/labtether-agent
      - name: Verify installed command starts
        if: needs.line-limit.outputs.checks_required != 'false'
        run: |
          "${RUNNER_TEMP}/labtether-agent" --help >/dev/null
      - name: Install pinned source-quality tools
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
          CHECKS_REQUIRED: ${{ needs.line-limit.outputs.checks_required }}
        run: |
          if [[ "${CHECKS_REQUIRED}" != "false" ]]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Security and workflow contracts
        env:
          CHECKS_REQUIRED: ${{ needs.line-limit.outputs.checks_required }}
        run: |
          if [[ "${CHECKS_REQUIRED}" != "false" ]]; then
            gosec -quiet ./...
          fi
          actionlint
          gitleaks dir . --no-banner --redact --timeout 300

  cross-platform-source-contract:
    name: Source portability (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [line-limit]
    if: >-
      !cancelled() && (needs.line-limit.result != 'success' ||
      needs.line-limit.outputs.checks_required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    steps:
      - name: Require source-size and selection gates
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
        run: test "${LINE_LIMIT_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Compile command and test packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p "${RUNNER_TEMP}/test-binaries"
          go build -trimpath -o "${RUNNER_TEMP}/labtether-agent-${GOOS}-${GOARCH}" ./cmd/labtether-agent
          go test -c -o "${RUNNER_TEMP}/test-binaries/" ./...
